name: Platform checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The locked cmake crate supports Visual Studio 2022, not VS 2026.
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Keep the checks on the toolchain used for recent upstream validation.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev clang cmake ffmpeg
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ffmpeg
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm ffmpeg -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked --all-targets
      - name: Check production lints
        run: cargo clippy --locked --lib --bin ostt -- -D warnings
      - name: Build release binary
        run: cargo build --locked --release
